# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy

# Triggered by CI finishing, not by the push itself. On a push trigger the two
# workflows raced, so a red build still shipped — and the landing page tells
# agencies that backend, frontend, formatting and static-route checks run
# before production deployment. This is what makes that sentence true.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - master
  release:
    types: [published]

# Deployment authenticates to Fly with FLY_API_TOKEN, so the workflow token
# only ever needs to read the checkout.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    # A failed, cancelled or skipped CI run must not reach production.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # workflow_run checks out the default branch's tip unless told otherwise,
      # which would deploy a commit CI never tested. Pin the tested one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deployment not configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "Fly deployment is intentionally skipped until FLY_API_TOKEN is configured."
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: ${{ env.FLY_API_TOKEN != '' }}
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only

  announce_deploy:
    name: Announce deployment to Discord
    needs: deploy
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Announce to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping announcement"
            exit 0
          fi
          SHORT_SHA=${COMMIT_SHA:0:7}
          PAYLOAD=$(jq -n --arg sha "$SHORT_SHA" --arg run "$RUN_URL" \
            '{content: ("@everyone Glarion has been updated.\n\nWebsite: https://glarion.app\nCommit: `" + $sha + "`\nDeployment: " + $run), allowed_mentions: {parse: ["everyone"]}}')
          curl -sf --show-error -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

  # Releases remain separate from routine deployment notices so their notes
  # and public release link are preserved in full.
  announce_release:
    name: Announce release to Discord
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Announce to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping announcement"
            exit 0
          fi
          CONTENT=$(jq -n --arg name "$RELEASE_NAME" --arg body "$RELEASE_BODY" --arg url "$RELEASE_URL" \
            '"@everyone Glarion \($name) just shipped:\n\n\($body)\n\n\($url)"')
          PAYLOAD=$(jq -n --argjson content "$CONTENT" \
            '{content: $content, allowed_mentions: {parse: ["everyone"]}}')
          curl -sf --show-error -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
