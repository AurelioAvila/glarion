# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

# Deployment authenticates to Fly with FLY_API_TOKEN, so the workflow token
# only ever needs to read the checkout.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment not configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "Fly deployment is intentionally skipped until FLY_API_TOKEN is configured."
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: ${{ env.FLY_API_TOKEN != '' }}
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only

  # Every push deploys, but not every push is a release worth telling anyone
  # about. This only fires when a GitHub Release is actually published —
  # create one (with a tag) when there's something worth announcing.
  announce:
    name: Announce release to Discord
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Announce to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping announcement"
            exit 0
          fi
          CONTENT=$(jq -n --arg name "$RELEASE_NAME" --arg body "$RELEASE_BODY" --arg url "$RELEASE_URL" \
            '"@everyone Glarion \($name) just shipped:\n\n\($body)\n\n\($url)"')
          PAYLOAD=$(jq -n --argjson content "$CONTENT" \
            '{content: $content, allowed_mentions: {parse: ["everyone"]}}')
          curl -sf --show-error -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
