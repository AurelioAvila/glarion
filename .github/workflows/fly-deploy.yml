# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master

# Deployment authenticates to Fly with FLY_API_TOKEN, so the workflow token
# only ever needs to read the checkout.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment not configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "Fly deployment is intentionally skipped until FLY_API_TOKEN is configured."
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: ${{ env.FLY_API_TOKEN != '' }}
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only

      # No GitHub Releases here — Glarion deploys on every push to main — so
      # this announces the deploy itself instead of a release, using the
      # triggering commit as the "what's new" line.
      - name: Announce to Discord
        if: ${{ success() }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping announcement"
            exit 0
          fi
          CONTENT=$(jq -n --arg msg "$COMMIT_MESSAGE" --arg url "$COMMIT_URL" \
            '"@everyone Glarion just shipped:\n\n" + $msg + "\n\n" + $url')
          PAYLOAD=$(jq -n --argjson content "$CONTENT" \
            '{content: $content, allowed_mentions: {parse: ["everyone"]}}')
          curl -sf --show-error -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
