# fly.toml app configuration file generated for glarion-api on 2026-08-29T14:10:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'glarion-api'
primary_region = 'cdg'

[build]
[env]
  PORT = '8080'
  RUST_LOG = 'info,sqlx=warn'

[processes]
  app = '/usr/local/bin/api'
  worker = '/usr/local/bin/runner'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['worker']
