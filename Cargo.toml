[workspace]
resolver = "2"
members = ["crates/api", "crates/orchestrator", "crates/report"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hickory-resolver = "0.24"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "10"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
# Pinned to the ring provider rather than left on defaults: the aws-lc
# backend needs a C toolchain, which would make the build depend on the
# machine it runs on.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"
