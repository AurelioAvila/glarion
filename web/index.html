<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glarion</title>
<!-- Empty means same origin. Set this to point at a backend elsewhere. -->
<meta name="glarion-api" content="">
<style>
/*
  The rule this interface is built on: colour means security state, and
  nothing else.

  A dashboard where the buttons are blue, the links are blue and the logo is
  blue has spent its colour budget on decoration. Then a red badge has to
  compete with all of it. Here the chrome is achromatic — greys and one
  off-white — so the only coloured things on screen are the three that carry
  meaning: something is wrong, something needs a decision, something is
  fine. A glance at any page answers "is anything wrong" before a word is
  read.

  The second rule: this is an instrument, not a brochure. Hairlines instead
  of cards, tabular figures, monospace for anything a machine produced.
  Panels floating on panels add depth without adding information.
*/

:root {
  --bg: #0b0b0c;
  --raise: #131315;
  --sink: #08080a;

  --rule: #22232a;
  --rule-soft: #17181d;

  --ink: #f0f0f2;
  --ink-2: #9c9ea8;
  --ink-3: #63656f;

  /* The entire signal palette. Nothing else in this file is coloured. */
  --alarm: #ff6b57;
  --caution: #e5a83c;
  --clear: #52c78d;

  /* Charts borrow the ink, not the signal palette: a line showing how many
     problems there were is not itself a warning, and colouring it red would
     say "alarm" on a chart that might be showing an improvement. */
  --chart-line: #8d90a0;
  --chart-fill: rgba(141, 144, 160, .13);

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  /* A very slight lift behind the masthead. Flat near-black over a whole
     screen reads as unfinished rather than as restrained; this is barely
     perceptible on its own but gives the page a top and a bottom. */
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, .035), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

a { color: inherit; text-decoration: none; }

/* --- masthead ---------------------------------------------------------- */

header.top { border-bottom: 1px solid var(--rule); }
.top-inner {
  max-width: 58rem;
  margin: 0 auto;
  padding: 0 2rem;
  height: 54px;
  display: flex;
  align-items: center;
  gap: 2rem;
}
.wordmark {
  font-family: var(--mono);
  font-size: .8rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink);
}

#nav-links { margin-left: auto; display: flex; align-items: center; gap: 1.5rem; }
#nav-links a, #nav-links button {
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  position: relative;
}
#nav-links a:hover, #nav-links button:hover { color: var(--ink); }
#nav-links a.active { color: var(--ink); }
/* The current section is underscored rather than boxed — a box is another
   panel, and there are enough of those in the world. */
#nav-links a.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1.05rem;
  height: 1px;
  background: var(--ink);
}

main { max-width: 58rem; margin: 0 auto; padding: 3rem 2rem 7rem; }

/* --- the standing statement -------------------------------------------- */

/*
  A sentence, not a row of tiles. Three numbers in boxes make a reader do
  the interpreting; a sentence has already done it. The numbers inside are
  emphasised so the shape is still scannable.
*/
.standing {
  font-size: 1.45rem;
  line-height: 1.4;
  letter-spacing: -.02em;
  margin: 0 0 .5rem;
  font-weight: 400;
  color: var(--ink-2);
  max-width: 34rem;
}
.standing strong { color: var(--ink); font-weight: 560; }
.standing .alarm { color: var(--alarm); font-weight: 560; }
.standing .caution { color: var(--caution); font-weight: 560; }
.standing .clear { color: var(--clear); font-weight: 560; }

.standing-meta {
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 2.75rem;
}

.section-rule {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin: 0 0 .25rem;
  padding-bottom: .6rem;
  border-bottom: 1px solid var(--rule);
}
.section-rule h2 {
  font-family: var(--mono);
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0;
}
.section-rule .count { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); margin-left: auto; }

/* --- the ledger -------------------------------------------------------- */

/*
  Rows on hairlines, not cards. A card is a box drawn around content that
  was already grouped by proximity; forty of them is forty borders competing
  with the data inside them.

  Each row carries a spine in the left gutter: a two-pixel mark whose colour
  is the site's state. Running the eye down that gutter is the fastest read
  on the page, and it costs no space.
*/
.ledger { list-style: none; margin: 0; padding: 0; }

.entry {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1.5rem 2rem;
  align-items: center;
  padding: 1.15rem 0 1.15rem 1.5rem;
  border-bottom: 1px solid var(--rule-soft);
  transition: background .1s ease;
}
.entry:hover { background: var(--raise); }

/*
  The keyboard's position in the list. Deliberately different from hover —
  a brighter ground plus a hairline on the right — so that moving the mouse
  across the page does not make you lose where the keyboard was.
*/
.entry-on { background: var(--raise); box-shadow: inset -2px 0 0 var(--ink-3); }
.entry:focus-visible { outline: none; background: var(--raise); box-shadow: inset -2px 0 0 var(--ink); }
.entry::before {
  content: "";
  position: absolute;
  left: 0;
  top: .9rem;
  bottom: .9rem;
  width: 2px;
  background: currentColor;
  border-radius: 1px;
}
.entry-alarm { color: var(--alarm); }
.entry-caution { color: var(--caution); }
.entry-clear { color: var(--clear); }
.entry-idle { color: var(--rule); }

.entry-name {
  font-family: var(--mono);
  font-size: .97rem;
  color: var(--ink);
  letter-spacing: -.01em;
}
.entry-client { color: var(--ink-3); font-size: .84rem; margin-top: .2rem; }

.entry-state {
  font-size: .87rem;
  color: var(--ink-2);
  margin-top: .35rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}
.entry-state .headline { color: currentColor; font-weight: 550; }
.entry-state .sep { color: var(--rule); }
.entry-state .watching {
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.entry-right { display: flex; align-items: center; gap: 1.5rem; }

/*
  How the outstanding work splits by rank, as a stack of short bars.
  "3 to fix" does not say whether that is three trivia or one serious
  problem and two notes, and those need different amounts of somebody's
  afternoon.
*/
.split { display: flex; gap: 2px; align-items: center; }
.split-mark { width: 3px; height: 12px; border-radius: 1px; }
.split-urgent, .split-high { background: var(--alarm); }
.split-medium { background: var(--caution); }
.split-low { background: var(--ink-3); }

/* --- history strip ----------------------------------------------------- */

/*
  The last few scans as bars, oldest on the left.

  This is the thing a tile cannot say. An agency's job is noticing change —
  a site that went from clean to three issues matters more than a site that
  has had three all along — and a single number hides exactly that.
*/
.history { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
.history-bar {
  width: 5px;
  border-radius: 1px;
  background: currentColor;
  opacity: .85;
}
.history-empty {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.entry-go { font-family: var(--mono); font-size: .8rem; color: var(--ink-3); }
.entry:hover .entry-go { color: var(--ink); }

/* --- what we know ------------------------------------------------------ */

/*
  Facts pulled from the same scan that produced the findings. Two columns
  of label-and-value, dense on purpose: this is reference material somebody
  scans for one line, not prose.
*/
.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .1rem 2.5rem;
  margin: 1.25rem 0 0;
}
.fact {
  display: flex;
  align-items: baseline;
  gap: .9rem;
  padding: .55rem 0;
  border-bottom: 1px solid var(--rule-soft);
  min-width: 0;
}
.fact-label {
  flex: none;
  width: 6.5rem;
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.fact-value {
  font-size: .88rem;
  color: var(--ink-2);
  min-width: 0;
  overflow-wrap: anywhere;
}

/* --- charts ------------------------------------------------------------ */

.chart-frame { margin: 1.4rem 0 .4rem; }
.chart-axis {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: .5rem;
}

/*
  One bar showing how a total splits by rank. A comparison of lengths,
  because people read those accurately and read angles badly.
*/
.proportion {
  display: flex;
  gap: 2px;
  height: 6px;
  margin: 1rem 0 .75rem;
}
.proportion-part { border-radius: 1px; }
.part-alarm { background: var(--alarm); }
.part-caution { background: var(--caution); }
.part-low { background: var(--ink-3); }
.part-clear { background: var(--clear); }

.legend {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  font-size: .8rem;
  color: var(--ink-3);
}
.legend-item { display: flex; align-items: center; gap: .45rem; }
.legend-swatch { width: 8px; height: 8px; border-radius: 2px; }

/* --- procedure (verification, onboarding) ------------------------------ */

/*
  Numbered steps down a rule, the way a procedure is written down. The
  ownership step asks somebody to leave the product and edit their DNS, so
  it reads better as instructions than as a card with a button.
*/
.procedure { list-style: none; margin: 0; padding: 0; }
.procedure > li {
  position: relative;
  padding: 0 0 1.6rem 2.6rem;
  border-left: 1px solid var(--rule);
  margin-left: .6rem;
}
.procedure > li:last-child { border-left-color: transparent; padding-bottom: 0; }
.procedure > li::before {
  content: attr(data-step);
  position: absolute;
  left: -.66rem;
  top: -.1rem;
  width: 1.3rem;
  height: 1.3rem;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--rule);
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: .68rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.procedure h3 { font-size: .95rem; margin: 0 0 .25rem; font-weight: 560; letter-spacing: -.01em; }
.procedure p { margin: 0; color: var(--ink-2); font-size: .89rem; }

/* --- worklist (findings) ----------------------------------------------- */

/*
  Findings as a worklist, in the order they should be dealt with, each one
  numbered. A grid of cards implies the reader chooses; a numbered list
  says where to start.
*/
.worklist { list-style: none; margin: 0; padding: 0; counter-reset: item; }
.work-item {
  position: relative;
  padding: 1.4rem 0 1.4rem 3rem;
  border-bottom: 1px solid var(--rule-soft);
}
.work-item::before {
  counter-increment: item;
  content: counter(item, decimal-leading-zero);
  position: absolute;
  left: 0;
  top: 1.5rem;
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--ink-3);
}
.work-head { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
.work-head h3 { font-size: 1rem; margin: 0; font-weight: 560; letter-spacing: -.012em; }
.rank {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.rank-urgent, .rank-high { color: var(--alarm); }
.rank-medium { color: var(--caution); }
.rank-low { color: var(--ink-3); }
.rank-none { color: var(--ink-3); }

.work-why { color: var(--ink-2); margin: .55rem 0 0; font-size: .92rem; }
.work-fix {
  margin: .7rem 0 0;
  padding-left: .9rem;
  border-left: 2px solid var(--rule);
  font-size: .92rem;
}
.work-label {
  display: block;
  font-family: var(--mono);
  font-size: .65rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: .2rem;
}
.work-evidence { margin: .7rem 0 0; font-size: .86rem; color: var(--ink-3); }
.work-repeat { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }

/* --- text -------------------------------------------------------------- */

h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.025em; font-weight: 560; }
h1.mono { font-family: var(--mono); font-size: 1.3rem; letter-spacing: -.01em; }
h2 { font-size: 1rem; margin: 0; font-weight: 560; }
h3 { margin: 0; }

.lede { color: var(--ink-2); margin: .35rem 0 0; }
.back {
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: inline-block;
  margin-bottom: 1.5rem;
}
.back:hover { color: var(--ink); }
.muted { color: var(--ink-3); font-size: .87rem; }
.mono-note { font-family: var(--mono); font-size: .76rem; color: var(--ink-3); letter-spacing: .04em; }
.loading { color: var(--ink-3); font-family: var(--mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }
.blurb { color: var(--ink-2); font-size: .92rem; margin: .5rem 0 2rem; max-width: 34rem; }
.hint { display: block; color: var(--ink-3); font-size: .8rem; margin-top: .3rem; }
.hint-error { color: var(--alarm); }
.hint-error[hidden] { display: none; }

.head-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 2rem;
  margin-bottom: 2.25rem;
}

/* --- controls ---------------------------------------------------------- */

/*
  Buttons are achromatic. The primary action is an inverted block — the
  strongest thing available without spending colour, which is reserved.
*/
button { font: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }

.primary {
  background: var(--ink);
  color: var(--bg);
  border: 0;
  border-radius: 2px;
  padding: .6rem 1.15rem;
  font-size: .87rem;
  font-weight: 560;
  white-space: nowrap;
}
.primary:hover:not(:disabled) { background: #fff; }

.ghost {
  background: none;
  color: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: .55rem 1rem;
  font-size: .85rem;
  white-space: nowrap;
}
.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }

.linklike {
  background: none;
  border: 0;
  padding: 0;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--ink-3);
}
.linklike:hover { text-decoration-color: var(--ink); }

a.inline { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-3); }
a.inline:hover { text-decoration-color: var(--ink); }

label { display: block; margin-bottom: 1.1rem; }
.label-text {
  display: block;
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: .4rem;
}

input {
  display: block;
  width: 100%;
  padding: .6rem 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  color: var(--ink);
  font: inherit;
}
input::placeholder { color: var(--ink-3); }
input:focus { outline: none; border-bottom-color: var(--ink); }
input[type="date"] { font-family: var(--mono); font-size: .92rem; }

/* Chrome paints autofilled fields with its own light background, which on
   a dark form looks like a rendering fault. The background cannot be set
   directly on these, so an inset shadow covers the field instead, and the
   long transition stops the original colour flashing through on load. */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--ink);
  -webkit-box-shadow: 0 0 0 100px var(--bg) inset;
  caret-color: var(--ink);
  transition: background-color 100000s ease-in-out 0s;
}
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.55); cursor: pointer; }

.checkbox { display: flex; align-items: center; gap: .6rem; cursor: pointer; font-size: .88rem; color: var(--ink-2); }
.checkbox input { width: auto; padding: 0; border: 0; accent-color: var(--ink); cursor: pointer; }

.field-pair { display: flex; gap: 1.5rem; }
.field-pair label { flex: 1 1 0; min-width: 0; }

.field-row { display: flex; gap: 1.25rem; align-items: flex-end; }
.field-row label { flex: 1 1 12rem; margin-bottom: 0; }

.auth { max-width: 22rem; margin: 4.5rem auto 0; }
.auth h1 { margin-bottom: 1.9rem; }
.auth .primary { width: 100%; margin-top: .5rem; }
.switch { margin: 1.6rem 0 0; font-size: .87rem; color: var(--ink-3); }

/* --- notices ----------------------------------------------------------- */

/*
  Notices borrow the signal palette, because a failure genuinely is one of
  the states colour is reserved for.
*/
.notice {
  margin: 0 0 1.4rem;
  padding-left: .9rem;
  border-left: 2px solid currentColor;
  font-size: .89rem;
}
.notice-error { color: var(--alarm); }
.notice-ok { color: var(--clear); }
.notice-info { color: var(--ink-2); border-left-color: var(--rule); }

/* --- key/value, copy fields -------------------------------------------- */

.kv { display: grid; grid-template-columns: 6rem 1fr; gap: .55rem 1.25rem; align-items: center; }
.kv dt {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.kv dd { margin: 0; min-width: 0; }

.copyable { display: flex; align-items: center; gap: .75rem; min-width: 0; }
.copyable-value {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--mono);
  font-size: .86rem;
  color: var(--ink);
  background: var(--sink);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: .4rem .55rem;
  overflow-wrap: anywhere;
}
.copy-button {
  flex: none;
  background: none;
  border: 0;
  padding: 0;
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.copy-button:hover { color: var(--ink); }

.tabs { display: flex; gap: 1.75rem; margin-bottom: 1.6rem; border-bottom: 1px solid var(--rule); }
.tab {
  background: none;
  border: 0;
  padding: 0 0 .7rem;
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-3);
  position: relative;
}
.tab:hover { color: var(--ink-2); }
.tab-active { color: var(--ink); }
.tab-active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: var(--ink);
}

.method-pane[hidden] { display: none; }

code {
  font-family: var(--mono);
  font-size: .87em;
  color: var(--ink-2);
  overflow-wrap: anywhere;
}

/* --- appendix ---------------------------------------------------------- */

.appendix {
  columns: 2;
  column-gap: 2.5rem;
  list-style: none;
  padding: 0;
  margin: 0;
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--ink-3);
}
.appendix li { margin: .3rem 0; break-inside: avoid; }
.appendix li::before { content: "— "; color: var(--rule); }

/* --- command palette --------------------------------------------------- */

.palette-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .62);
  backdrop-filter: blur(2px);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 12vh 1.25rem 1.25rem;
  z-index: 100;
  animation: fade .1s ease-out;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

.palette {
  width: 100%;
  max-width: 34rem;
  background: var(--raise);
  border: 1px solid var(--rule);
  border-radius: 6px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
  overflow: hidden;
  animation: rise .12s ease-out;
}
@keyframes rise { from { transform: translateY(-6px); opacity: .6 } to { transform: none; opacity: 1 } }

.palette-input {
  width: 100%;
  padding: 1rem 1.1rem;
  border: 0;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  background: none;
  color: var(--ink);
  font-size: 1rem;
}
.palette-input:focus { outline: none; border-bottom-color: var(--rule); }

.palette-results { max-height: 48vh; overflow-y: auto; padding: .4rem 0; }

.palette-group {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: .7rem 1.1rem .3rem;
}

.palette-item {
  display: flex;
  align-items: baseline;
  gap: .75rem;
  padding: .5rem 1.1rem;
  cursor: pointer;
  border-left: 2px solid transparent;
}
.palette-item-on { background: var(--bg); border-left-color: var(--ink); }
